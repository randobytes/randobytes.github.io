<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Doto:wght@100..900&family=VT323&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Electrolize&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles/style.css">

    <link rel="icon" href="favicon32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="favicon16.png" type="image/png" sizes="16x16">

    <title>Randobytes - video games with soul and pixels</title>
    <meta name="description" content="Randobytes - indie game development studio">

</head>

<body class="video">
    <video class="video-background" autoplay loop muted>
        <source src="images/bg_main.mp4" type="video/mp4">
    </video>

    <div class="top-menu" id="top-menu"></div>
    <script src="scripts/menu_main.js"></script>

    <header>
        <div class="center">
            <h1><img class="title-long" src="images/rnd_logo_3.png"
                    alt="Randobytes - video games with soul and pixels" /></h1>
        </div>
    </header>

    <main>
        <div class="center">
            <div class="banner">
                <a href="https://store.steampowered.com/app/3444600/Galaxyz/" target="_blank">
                    <img src="galaxyz/images/galaxyz_steam.jpg" alt="Wishlist Galaxyz on Steam" />
                </a>
            </div>

            <div class="panel">
                <h2>Randobytes newsletter</h2>
                <p class="center">Subscribe to Randobytes newsletter to receive updates about games, and exclusive
                    behind-the-scenes content:</p>
                <div data-getsitecontrol-inline="508726"></div>
                <p class="center small">No spam, just the good stuff. Unsubscribe at any time.</p>
                <script type="text/javascript" async src="//l.getsitecontrol.com/p7jn90m4.js"></script>
            </div>
        </div>
    </main>

    <footer id="footer"></footer>
    <script src="scripts/footer.js"></script>

</body>

</html>
