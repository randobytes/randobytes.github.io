<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Subscribe</title>
    <script src="https://www.google.com/recaptcha/api.js?render=6Le16ccrAAAAAHt00Pti9Gux0vsaSguIliYZ7zXs"></script>
</head>

<body>
    <form id="subscribe-form">
        <input type="text" id="name" name="name" placeholder="Your name" />
        <input type="email" id="email" name="email" placeholder="you@email.com" required />
        <button type="submit">Subscribe</button>
        <div id="status" aria-live="polite"></div>
        <div id="log" aria-live="polite"></div>
    </form>

    <script>
        const SITE_KEY = '6Le16ccrAAAAAHt00Pti9Gux0vsaSguIliYZ7zXs';
        const EDGE_FN_URL = 'https://appkznwsowbybsengcir.supabase.co/functions/v1/subscribe';

        const form = document.getElementById('subscribe-form');
        const status = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            status.textContent = 'Processing...';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();

            log.textContent = log.textContent + '<br />name = ' + name;
            log.textContent = log.textContent + '<br />email = ' + email;
            log.textContent = log.textContent + '<br />url = ' + window.location.href;

            if (!email) {
                status.textContent = 'Please provide an email.';
                return;
            }

            try {
                const token = await grecaptcha.execute(SITE_KEY, { action: 'subscribe' });

                log.textContent = log.textContent + '<br />token = ' + token;

                const res = await fetch(EDGE_FN_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name,
                        email,
                        captcha: token,
                        page_url: window.location.href,
                        action: 'subscribe'
                    })
                });

                const json = await res.json();

                if (res.ok) {
                    status.textContent = json.message || 'Subscribed successfully.';
                } else {
                    status.textContent = json.error || 'Subscription failed.';
                }
            } catch (err) {
                console.error(err);
                status.textContent = 'An error occurred. Please try again.';
            }
        });

        // pre-load token for better UX
        // grecaptcha.ready(() => { grecaptcha.execute(SITE_KEY, { action: 'subscribe' }); });
    </script>
</body>

</html>
